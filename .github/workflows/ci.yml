name: FinFlow Fullstack CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: finflow_user
      DB_PASSWORD: finflow_secure_pass
      DB_NAME: finflow_db
      DB_ROOT_PASSWORD: super_secret_root_pass

    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем Node.js окружение
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Создаем временный файл .env для Docker Compose из безопасных глобальных переменных среды
      - name: Create temporary .env file for Docker
        run: |
          echo "DB_HOST=$DB_HOST" >> .env
          echo "DB_PORT=$DB_PORT" >> .env
          echo "DB_USER=$DB_USER" >> .env
          echo "DB_PASSWORD=$DB_PASSWORD" >> .env
          echo "DB_NAME=$DB_NAME" >> .env
          echo "DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD" >> .env

      # 4. Поднимаем базу данных MySQL внутри Docker
      - name: Start Docker Containers (MySQL)
        run: docker compose up -d

      # 5. Устанавливаем зависимости проекта (ДОБАВИЛИ О БЯЗАТЕЛЬНЫЙ ФЛАГ)
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 6. Собираем продакшен-версию приложения (standalone)
      - name: Build application
        run: npm run build

      # 7. Запускаем миграции Drizzle, чтобы в базе Docker создались нужные таблицы
      - name: Push Database Schema
        run: npx drizzle-kit push

      # 8. Запускаем модульные тесты бэкенда (Vitest)
      - name: Run Backend Tests (Vitest)
        run: npm run test

      # 9. Устанавливаем системные браузеры для Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 10. Запускаем локальный скомпилированный Next.js сервер в фоне для E2E тестов
      - name: Start production server in background
        run: |
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/public
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r public/* .next/standalone/public/
          node .next/standalone/server.js &

      # 11. Запускаем сквозные E2E тесты браузера (Playwright)
      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e
