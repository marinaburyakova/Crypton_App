name: FinFlow Fullstack CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Start Docker Containers (MySQL)
        run: docker compose up -d

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: finflow_user
          DB_PASSWORD: finflow_secure_pass
          DB_NAME: finflow_db

      - name: Run Backend Tests (Vitest)
        run: npx vitest run

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start production server in background
        run: |
          # На Linux-серверах GitHub используем стандартное копирование cp
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/public
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r public/* .next/standalone/public/
          PORT=3000 node .next/standalone/server.js &
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: finflow_user
          DB_PASSWORD: finflow_secure_pass
          DB_NAME: finflow_db

      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e
