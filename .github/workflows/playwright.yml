name: Playwright End-to-End Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Настраиваем Node.js окружение для запуска самих тестов Playwright
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    # 2. Устанавливаем локальные зависимости проекта (нужно для работы drizzle-kit и playwright)
    - name: Install dependencies
      run: npm ci

    # 3. Устанавливаем браузеры для Playwright
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 4. Создаем .env файл со всеми нужными доступами прямо внутри бегунка GitHub Actions
    - name: Create local .env file
      run: |
        echo "DB_HOST=db" >> .env
        echo "DB_USER=finflow_user" >> .env
        echo "DB_PASSWORD=finflow_secure_pass" >> .env
        echo "DB_NAME=finflow_db" >> .env
        echo "DB_PORT=3306" >> .env
        echo "DB_ROOT_PASSWORD=root_secure_master_pass" >> .env

    # 5. Поднимаем вашу Docker-инфраструктуру (Бэкенд, Базу данных и Adminer) в фоновом режиме (-d)
    - name: Start Docker Compose
      run: docker compose up -d --build

    # 6. НАКАТЫВАЕМ МИГРАЦИИ (Пушим схему во вновь созданную базу в Docker)
    # Используем хост localhost, так как команда летит из самого окружения Ubuntu в проброшенный порт 3306 контейнера
    - name: Push Drizzle Schema to Docker MySQL
      run: DB_HOST=localhost npx drizzle-kit push

    # 7. Запускаем тесты Playwright (они пойдут на http://localhost:3000, который проброшен из контейнера)
    - name: Run Playwright tests
      run: npx playwright test

    # 8. Сохраняем отчеты и скриншоты, если тесты все-таки упадут (для отладки)
    - name: Upload Playwright Report Artifact
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 15
